services:
  location-picker:
    build: .
    container_name: location-picker
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - TOKEN=${TOKEN:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - AMAP_KEY=${AMAP_KEY:-}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-0}
      - PORT=${PORT:-8080}
      - DATA_FILE=/data/loc.json
    volumes:
      - .:/data
    restart: unless-stopped
